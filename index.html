<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Minecraf de Santi</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div class="hud">
      <div id="hearts" class="hearts" role="img"></div>
      <div id="day-clock" class="day-clock" role="img"></div>
      <div class="actions">
        <button type="button" id="bag-btn" class="action-btn" aria-label="Mochila" title="Mochila" aria-pressed="false">🎒</button>
        <button type="button" id="undo-btn" class="action-btn" aria-label="Deshacer" title="Deshacer">↩️</button>
        <button type="button" id="worlds-btn" class="action-btn" aria-label="Mis Mundos" title="Mis Mundos">🌍</button>
        <button type="button" id="new-world-btn" class="action-btn" aria-label="Crear nuevo mundo" title="Crear nuevo mundo">＋</button>
        <button type="button" id="mute-btn" class="action-btn" aria-label="Silencio" title="Silencio" aria-pressed="false">🔊</button>
        <button type="button" id="full-btn" class="action-btn" aria-label="Pantalla completa" title="Pantalla completa">⛶</button>
      </div>
      <div id="toolbar" class="toolbar" role="toolbar" aria-label="Herramientas"></div>
      <div id="hotbar" class="hotbar" role="toolbar" aria-label="Bloques"></div>
      <div id="too-far" class="too-far" aria-hidden="true">✋💨</div>
      <div class="controls-help" aria-label="Controles">
        <div class="keys"><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> 🚶</div>
        <div class="keys"><span class="key wide">␣</span> 🦘</div>
        <div class="keys"><span class="mouse left"></span> ✋⛏️ <span class="mouse right"></span> 🔄</div>
      </div>
    </div>
    <script type="module" src="/src/apps/game/main.ts"></script>
  </body>
</html>
