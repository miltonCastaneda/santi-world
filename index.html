<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minecraf de Santi</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <header class="top-bar">
      <h1>Minecraf de Santi</h1>
    </header>
    <div class="hud">
      <div class="modes">
        <button type="button" id="place-btn" class="mode-btn active">Poner</button>
        <button type="button" id="remove-btn" class="mode-btn remove">Quitar</button>
      </div>
      <div id="palette" class="palette"></div>
      <div class="actions">
        <button type="button" id="undo-btn" class="action-btn">Deshacer</button>
        <button type="button" id="worlds-btn" class="action-btn">🌍 Mis Mundos</button>
        <button type="button" id="new-world-btn" class="action-btn">＋ Crear nuevo mundo</button>
        <button type="button" id="full-btn" class="action-btn">Pantalla completa</button>
      </div>
    </div>
    <script type="module" src="/src/apps/game/main.ts"></script>
  </body>
</html>
